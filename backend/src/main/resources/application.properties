spring.application.name=dmart-backend
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dmart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=dmartSuperSecretKey2024MinimumRequired256BitsForHS256Algorithm
jwt.expiration=86400000

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://dmart-frontend.vercel.app}

# Logging
logging.level.com.dmart=INFO
